  <text x="24" y="28" class="tag">TOOLING // THREAT INTELLIGENCE WORKBENCH (CTI)</text>
  <rect x="810" y="14" width="170" height="26" rx="13" fill="#D4AF37"/>
  <text x="895" y="31" text-anchor="middle" class="cta">VER REPOSITÓRIO →</text>

  <text x="24" y="58" class="title">🛡️ ARGOS — Threat Intelligence Investigation Framework</text>
  <text x="24" y="80" class="sub">Framework local-first em Python com persistência SQLite, normalização determinística e Web UI local.</text>

  <text x="24" y="106" class="b-key">▸ Normalização &amp; Rigor Epistêmico: <tspan class="b-val">Extração de IOCs com tratamento de defang e estados (observed, reported, inferred).</tspan></text>
  <text x="24" y="126" class="b-key">▸ Correlação &amp; Pivot Limitado: <tspan class="b-val">Travessia estrutural controlada (max_depth/max_steps) sem expansão descontrolada.</tspan></text>
  <text x="24" y="146" class="b-key">▸ Avaliação &amp; Interoperabilidade: <tspan class="b-val">Análise multidimensional sem scores arbitrários e exportação para Markdown, CSV e STIX 2.1.</tspan></text>

